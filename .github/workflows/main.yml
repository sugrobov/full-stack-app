name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # убираем warning Node20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: store_db_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run migrations for test DB
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test
        run: node migrate.js
        working-directory: server

      - name: Run server integration tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test
        run: npm test
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client unit tests
        run: npm run test
        working-directory: client

      # --- E2E шаги ---
      - name: Start server in test mode
        run: nohup npm run start:test --prefix server &
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test

      - name: Start client dev server
        run: nohup npm run dev --prefix client &

      - name: Wait for servers to be ready
        run: npx wait-on http://127.0.0.1:5000/api/products http://127.0.0.1:5173
        
      - name: Run Cypress E2E tests
        run: npx cypress run