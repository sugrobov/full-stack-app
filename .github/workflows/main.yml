name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: store_db_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ===== Сервер =====
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server lint
        run: npm run lint
        working-directory: server

      - name: Run migrations for test DB
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test
        run: node migrate.cjs
        working-directory: server

      - name: Run server integration tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test
        run: npm test
        working-directory: server

      # ===== Клиент =====
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client lint
        run: npm run lint
        working-directory: client

      - name: Run client unit tests
        run: npm run test
        working-directory: client

      # ===== E2E (Cypress) =====
      - name: Install root dependencies (Cypress)
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Create client .env for E2E
        run: echo "VITE_API_URL=/api" > client/.env

      - name: Start server in test mode
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: store_db_test
          START_SERVER: true
        run: |
          nohup node server/server.js > /tmp/server.log 2>&1 &
          echo "Server PID: $!"

      - name: Start client dev server
        run: |
          nohup npx vite --host --port 5173 --prefix client > /tmp/client.log 2>&1 &
          echo "Client PID: $!"

      - name: Wait for servers
        run: |
          echo "=== Waiting for server (port 5000) ==="
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/products || echo "000")
            echo "Attempt $i: server $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "Server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start. Logs:"
              cat /tmp/server.log
              exit 1
            fi
            sleep 2
          done

          echo "=== Waiting for client (port 5173) ==="
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173 || echo "000")
            echo "Attempt $i: client $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "Client is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Client failed to start. Logs:"
              cat /tmp/client.log
              exit 1
            fi
            sleep 2
          done

      - name: Verify API through Vite proxy
        run: |
          echo "Testing API proxy..."
          curl -s http://127.0.0.1:5173/api/products | head -c 200
          echo ""

      - name: Run Cypress E2E tests
        run: npx cypress run
        env:
          CYPRESS_baseUrl: http://127.0.0.1:5173
          CYPRESS_defaultCommandTimeout: 10000